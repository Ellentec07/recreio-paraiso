<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore os espaços</title>
    <link rel="stylesheet" href="mapa.css">
</head>
<body>

    <main class="pagina">

        <header class="cabecalho">
            <h1>Explore os espaços</h1>
            <p>Selecione um ponto no mapa para conhecer os locais do parque.</p>
        </header>

        <section class="conteudo">

          
            <div class="mapa">
                <img
                    src="991f0517-ef34-493a-8248-1fd937212947.jpg"
                    alt="Imagem de satélite do parque"
                >

                <div class="legenda">
                    <span class="bolinha"></span>
                    <span>Espaços do parque</span>
                </div>
            </div>

            <!-- PAINEL LATERAL -->
            <aside class="painel">

                <span class="etiqueta">EXPLORE O LOCAL</span>

                <h2>Conheça o parque</h2>

                <p>
                    Explore a imagem e conheça os espaços que fazem
                    parte do parque. Aqui você poderá visualizar sua
                    estrutura e os ambientes presentes no local.
                </p>

            </aside>

        </section>

    </main>

</body>
</html>
